services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocket
      POSTGRES_DB: pocket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pocket-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pocket -d pocket"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pocket:${POSTGRES_PASSWORD}@db:5432/pocket
      OWNER_TOKEN: ${OWNER_TOKEN:?Set OWNER_TOKEN in .env}
      SEPAY_WEBHOOK_KEY: ${SEPAY_WEBHOOK_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
volumes:
  pocket-db:
  caddy-data:
  caddy-config:
